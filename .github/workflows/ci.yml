name: Checks

# Runs the safety checks on every push and pull request. If anything is broken
# — a truncated file, a dead nav link, or a broken contact form — this turns red
# before the change reaches the live site.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
